<html lang="en">

  <style>
    :root {
      --bg: #F5EFE6;
      --surface: #FFFDF9;
      --linen: #EBE3D5;
      --border: #DDD3C3;
      --ink: #1C1917;
      --ink-2: #3F3A36;
      --muted: #6B635B;
      --terracotta: #C25934;
      --terracotta-hover: #A64827;
      --terracotta-soft: #FAEBE4;
      --forest: #2E6F40;
      --forest-hover: #235732;
      --forest-soft: #E6F2EA;
      --amber: #B45309;
      --amber-soft: #FEF3C7;
      --shadow: 0 8px 24px -8px rgba(28, 25, 23, 0.08);
      --shadow-lg: 0 24px 48px -14px rgba(28, 25, 23, 0.16);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    h1, h2, h3, .serif { font-family: 'Fraunces', serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    /* Header */
    header {
      background: rgba(245, 239, 230, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .nav-wrap {
      max-width: 1140px;
      margin: 0 auto;
      padding: 14px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .nav-left { display: flex; align-items: center; gap: 14px; }
    .back-link {
      text-decoration: none;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 99px;
      background: var(--linen);
      transition: all 0.15s;
    }
    .back-link:hover { color: var(--ink); background: var(--border); }
    .brand {
      font-family: 'Fraunces', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
    }
    .brand span { color: var(--terracotta); }

    /* Container */
    .container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 32px 20px 80px;
    }

    /* Top Course + Search Bar */
    .top-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 28px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }
    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .top-row h1 { font-size: clamp(1.5rem, 3vw, 2rem); letter-spacing: -0.02em; }

    /* Smart Search with Live Suggestions */
    .search-box {
      position: relative;
      width: 100%;
      max-width: 420px;
    }
    .search-box input {
      width: 100%;
      padding: 12px 92px 12px 40px;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: var(--bg);
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
    }
    .search-box input:focus { border-color: var(--terracotta); background: var(--surface); }
    .search-box svg {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
    }
    .search-btn {
      position: absolute;
      right: 5px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--ink);
      color: var(--bg);
      border: none;
      border-radius: 9px;
      padding: 7px 14px;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .suggestions {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow-lg);
      z-index: 60;
      max-height: 300px;
      overflow-y: auto;
    }
    .suggestions.open { display: block; }
    .sug-row {
      padding: 11px 14px;
      border-bottom: 1px solid var(--linen);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .sug-row:last-child { border-bottom: none; }
    .sug-row:hover { background: var(--bg); }

    /* Course Selector Tiles */
    .course-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .course-grid {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .course-pill {
      background: var(--bg);
      border: 1.5px solid var(--border);
      color: var(--ink-2);
      padding: 10px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .course-pill:hover { border-color: var(--terracotta); color: var(--terracotta); }
    .course-pill.active {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink);
    }

    /* Syllabus Subject Grid */
    .section-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .section-bar h2 { font-size: 1.35rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .code-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.76rem;
      font-weight: 700;
      background: var(--terracotta-soft);
      color: var(--terracotta);
      padding: 4px 10px;
      border-radius: 7px;
    }
    .pattern-tag { font-size: 0.76rem; color: var(--muted); font-weight: 600; }

    .pyq-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .pyq-chip {
      text-decoration: none;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--ink-2);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.15s;
    }
    .pyq-chip:hover { border-color: var(--terracotta); color: var(--terracotta); background: var(--terracotta-soft); }

    .card-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--linen);
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 14px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.15s;
    }
    .btn-dark { background: var(--ink); color: var(--bg); }
    .btn-dark:hover { background: #332E2A; }
    .btn-outline { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border); }
    .btn-outline:hover { background: var(--linen); }
    .btn-buy { background: var(--forest); color: #fff; width: 100%; padding: 11px 14px; }
    .btn-buy:hover { background: var(--forest-hover); }

    /* Modal for CBT Mock & Cheat Sheet */
    .modal-bg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(28, 25, 23, 0.55);
      backdrop-filter: blur(4px);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
      align-items: flex-start;
      justify-content: center;
    }
    .modal-bg.open { display: flex; }
    .modal-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      max-width: 780px;
      width: 100%;
      padding: 28px;
      margin: 24px auto;
      box-shadow: var(--shadow-lg);
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      margin-bottom: 18px;
      border-bottom: 1px solid var(--linen);
      gap: 12px;
    }
    .close-btn {
      background: var(--linen);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 99px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 700;
    }

    .opt-btn {
      width: 100%;
      text-align: left;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 9px;
      font-family: inherit;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .opt-btn.selected { border-color: var(--terracotta); background: var(--terracotta-soft); font-weight: 700; }

    .sheet-card {
      background: var(--bg);
      border-left: 4px solid var(--terracotta);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .sheet-card h4 { font-size: 0.92rem; margin-bottom: 4px; }
    .sheet-card p { font-size: 0.84rem; color: var(--ink-2); }
  </style>
</head>

    let activeCourse = "ALL";
    let searchFilter = "";
    let mockState = { sub: null, idx: 0, ans: {} };

    function norm(s) { return (s || "").toLowerCase().replace(/[\s\-_]+/g, ""); }

    function selectCourse(course, btn) {
      activeCourse = course;
      searchFilter = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearFilterBtn").style.display = "none";
      document.querySelectorAll(".course-pill").forEach(p => p.classList.remove("active"));
      btn.classList.add("active");
      const labels = { ALL: "All Syllabus Papers", BAG: "B.A. / BAG Syllabus Papers", BCOMG: "B.Com / BCOMG Syllabus Papers", BSCG: "B.Sc / BSCG Syllabus Papers", BCA: "BCA Syllabus Papers", MBA: "MBA Syllabus Papers", MCOM: "M.Com Syllabus Papers" };
      document.getElementById("syllabusHeading").textContent = labels[course];
      renderSubjects();
    }

    function handleSearchInput() {
      const raw = document.getElementById("searchInput").value.trim();
      const box = document.getElementById("suggestionsBox");
      if (!raw) { box.classList.remove("open"); return; }
      const q = norm(raw);
      const matches = SUBJECTS.filter(s => norm(s.code).includes(q) || norm(s.name).includes(q)).slice(0, 6);
      box.innerHTML = matches.length ? matches.map(s => `
        <div class="sug-row" onclick="pickSearch('${s.code}')">
          <div>
            <span class="code-tag" style="margin-right:6px;">${s.code}</span>
            <strong style="font-size:0.86rem;">${s.name}</strong>
          </div>
          ${s.paidUrl ? `<a class="btn" style="background:var(--forest);color:#fff;padding:5px 10px;font-size:0.75rem;" href="${s.paidUrl}" target="_blank" onclick="event.stopPropagation()">PDF ₹79 ↗</a>` : `<span style="font-size:0.75rem;color:var(--muted);">View →</span>`}
        </div>
      `).join("") : `<div style="padding:12px 14px;font-size:0.84rem;color:var(--muted);">No matching subject found.</div>`;
      box.classList.add("open");
    }

    function pickSearch(code) {
      document.getElementById("suggestionsBox").classList.remove("open");
      document.getElementById("searchInput").value = code;
      searchFilter = code;
      document.getElementById("syllabusHeading").textContent = `Search Result: ${code}`;
      document.getElementById("clearFilterBtn").style.display = "inline-flex";
      renderSubjects();
    }

    function applySearch() {
      const raw = document.getElementById("searchInput").value.trim();
      document.getElementById("suggestionsBox").classList.remove("open");
      if (!raw) { clearSearch(); return; }
      searchFilter = raw;
      document.getElementById("syllabusHeading").textContent = `Search Results for "${raw}"`;
      document.getElementById("clearFilterBtn").style.display = "inline-flex";
      renderSubjects();
    }

    function clearSearch() {
      searchFilter = "";
      document.getElementById("searchInput").value = "";
      document.getElementById("clearFilterBtn").style.display = "none";
      renderSubjects();
    }

    document.addEventListener("click", e => {
      if (!e.target.closest(".search-box")) document.getElementById("suggestionsBox").classList.remove("open");
    });

    function renderSubjects() {
      const q = norm(searchFilter);
      const list = SUBJECTS.filter(s => {
        if (q) return norm(s.code).includes(q) || norm(s.name).includes(q);
        return activeCourse === "ALL" || s.courses.includes(activeCourse);
      });

      document.getElementById("subjectsGrid").innerHTML = list.length ? list.map(s => `
        <div class="card">
          <div class="card-top">
            <span class="code-tag">${s.code}</span>
            <span class="pattern-tag">${s.pattern}</span>
          </div>
          <h3 style="font-size:1.12rem;">${s.name}</h3>
          <div class="pyq-list">
            ${s.pyqs.map(p => `<a class="pyq-chip" href="${p.url}" target="_blank" rel="noopener">📄 ${p.session}</a>`).join("")}
          </div>
          <div class="card-actions">
            <button class="btn btn-dark" style="flex:1;" onclick="openMock('${s.code}')">Free Mock</button>
            <button class="btn btn-outline" style="flex:1;" onclick="openSheet('${s.code}')">Cheat Sheet</button>
            ${s.paidUrl ? `<a class="btn btn-buy" href="${s.paidUrl}" target="_blank" rel="noopener">🔥 ${s.paidLabel} ↗</a>` : ''}
          </div>
        </div>
      `).join("") : `<div class="card" style="grid-column:1/-1; text-align:center; color:var(--muted);">No syllabus papers match your search.</div>`;
    }

    /* MODAL: CHEAT SHEET */
    function openSheet(code) {
      const s = SUBJECTS.find(x => x.code === code);
      document.getElementById("modalContent").innerHTML = `
        <div class="modal-head">
          <div><span class="code-tag">${s.code}</span><h2 style="margin-top:6px;">${s.name} — Cheat Sheet</h2></div>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        ${s.cheatsheet.map(c => `<div class="sheet-card"><h4>${c.title}</h4><p>${c.body}</p></div>`).join("")}
        ${s.paidUrl ? `<a class="btn btn-buy" style="margin-top:14px;" href="${s.paidUrl}" target="_blank" rel="noopener">🔥 ${s.paidLabel} ↗</a>` : ''}
      `;
      document.getElementById("modalBg").classList.add("open");
    }

    /* MODAL: CBT MOCK TEST */
    function openMock(code) {
      mockState = { sub: SUBJECTS.find(x => x.code === code), idx: 0, ans: {} };
      renderMockQuestion();
      document.getElementById("modalBg").classList.add("open");
    }

    function renderMockQuestion() {
      const s = mockState.sub, qs = s.mock, q = qs[mockState.idx];
      const letters = ["A", "B", "C", "D"];
      document.getElementById("modalContent").innerHTML = `
        <div class="modal-head">
          <div><span class="code-tag">${s.code}</span> <strong style="margin-left:8px;">Q ${mockState.idx + 1} / ${qs.length}</strong></div>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        <h3 style="font-size:1.1rem; margin-bottom:16px; line-height:1.45;">${q.q}</h3>
        ${q.opts.map((o, i) => `
          <button class="opt-btn ${mockState.ans[mockState.idx] === i ? 'selected' : ''}" onclick="mockState.ans[${mockState.idx}]=${i}; renderMockQuestion()">
            <strong>${letters[i]}.</strong> <span>${o}</span>
          </button>
        `).join("")}
        <div style="display:flex; justify-content:space-between; margin-top:18px;">
          <button class="btn btn-outline" ${mockState.idx === 0 ? 'disabled' : ''} onclick="mockState.idx--; renderMockQuestion()">← Prev</button>
          ${mockState.idx < qs.length - 1
            ? `<button class="btn btn-dark" onclick="mockState.idx++; renderMockQuestion()">Next →</button>`
            : `<button class="btn" style="background:var(--forest);color:#fff;" onclick="submitMock()">Submit Test ✓</button>`}
        </div>
      `;
    }

    function submitMock() {
      const s = mockState.sub, qs = s.mock;
      let score = 0;
      qs.forEach((q, i) => { if (mockState.ans[i] === q.ans) score++; });
      document.getElementById("modalContent").innerHTML = `
        <div class="modal-head">
          <div><span class="code-tag">${s.code}</span><h2 style="margin-top:6px;">Score: ${score} / ${qs.length}</h2></div>
          <button class="close-btn" onclick="closeModal()">✕</button>
        </div>
        ${s.paidUrl ? `<a class="btn btn-buy" style="margin-bottom:18px;" href="${s.paidUrl}" target="_blank" rel="noopener">🔥 ${s.paidLabel} ↗</a>` : ''}
        ${qs.map((q, i) => {
          const ok = mockState.ans[i] === q.ans;
          return `<div class="sheet-card" style="border-left-color:${ok ? 'var(--forest)' : 'var(--terracotta)'}">
            <h4>Q${i + 1}. ${q.q}</h4>
            <p><strong>Correct:</strong> ${q.opts[q.ans]} — ${q.exp}</p>
          </div>`;
        }).join("")}
      `;
    }

    function closeModal() { document.getElementById("modalBg").classList.remove("open"); }

    renderSubjects();
  </script>
</body>
</html>
